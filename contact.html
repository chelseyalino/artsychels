<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <title>Contact Me</title>
</head>

<body>

    <header>
        <h1>Ane Chelsey S. Alino</h1>
<button type="button" id="theme-toggle">
    Switch to dark mode
</button>
        <button type="button" id="menu-toggle" aria-controls="main-nav" aria-expanded="false">
    Menu
</button>

<nav id="main-nav">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="skills.html">Skills</a>
    <a href="contact.html">Contact</a>
</nav>
    </header>

    <main>

      <form class="contact-card" id="contact-form">
    <p>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"
               aria-describedby="name-error" required>
        <span id="name-error" class="field-error" aria-live="polite"></span>
    </p>

    <p>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"
               aria-describedby="email-error" required>
        <span id="email-error" class="field-error" aria-live="polite"></span>
    </p>

    <p>
        <label for="subject">Subject:</label>
        <input type="text" id="subject" name="subject"
               aria-describedby="subject-error" required>
        <span id="subject-error" class="field-error" aria-live="polite"></span>
    </p>

    <p>
        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5"
                  aria-describedby="message-error" required></textarea>
        <span id="message-error" class="field-error" aria-live="polite"></span>
    </p>

    <p>
        <button type="submit">Send Message</button>
    </p>

    <p id="form-status" role="status"></p>
</form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Ane Chelsey S. Alino</p>
    </footer>
<script src="js/script.js" defer></script>
</body>

</html>
